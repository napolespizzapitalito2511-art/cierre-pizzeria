  await db.doc("solicitudes/"+r.id).update({estado:d.a==="ok"?"aprobada":"rechazada",resuelve:who()});await logH(d.a==="ok"?"precio_aprobado":"precio_rechazado",`${d.a==="ok"?"Aprobó":"Rechazó"} el precio de ${nameOf(r.k)} a ${cop(r.nuevo)} pedido por ${r.por}`,[{l:nameOf(r.k),a:cop(r.actual),d:cop(r.nuevo)}]);await loadReq();render()}
 if(d.a==="cdel"){try{await db.doc("usuarios/"+d.id).delete();await logH("usuario_borrado","Quitó el acceso del usuario "+(U[d.id]?.usuario||d.id));await loadUsers();renderPanel()}catch(x){toast("No se pudo borrar: "+(x?.message||x))}}
 if(d.a==="cadd"){const id=$("cid").value.trim().toLowerCase(),pw=$("cpw").value,m=x=>{$("cmsg").textContent=x};
  if(!/^[a-z0-9_-]{3,20}$/.test(id))return m("Usuario: 3 a 20 letras minúsculas, números, guion o guion bajo (sin espacios ni puntos).");
  if(!pw||pw.length<8)return m("La contraseña debe tener al menos 8 caracteres.");
  if(Object.values(U).some(u=>u.usuario===id))return m("Ese usuario ya existe.");
  try{let sec;try{sec=getApp("sec")}catch(x){sec=initializeApp(firebaseConfig,"sec")}
   const sa=getAuth(sec),cr=await createUserWithEmailAndPassword(sa,id+EMAIL,pw),nu=cr.user.uid;await signOut(sa);
   const rl=$("crol").value,sd=$("csed").value;await db.doc("usuarios/"+nu).set({usuario:id,nombre:$("cnom").value.trim()||id,rol:rl,sede:sd});
   await logH("usuario_guardado",`Creó el usuario ${id} (${ROLES[rl]}, ${sd})`);await loadUsers();renderPanel();$("cmsg").textContent="Usuario "+id+" creado ✓"}
  catch(x){m(x?.code==="auth/email-already-in-use"?"Ese usuario ya existe en el sistema; use otro nombre.":"No se pudo crear: "+(x?.message||x?.code||x))}}
 if(d.a==="login"){const u=$("lu").value.trim().toLowerCase(),p=$("lp").value;
  try{await signInWithEmailAndPassword(auth,(u.includes("@")?u:u+EMAIL),p)}catch(x){loginUi("Usuario o contraseña incorrectos.")}}
 if(d.a==="logout"){leave();$("modal").innerHTML="";await signOut(auth)}});
async function loadUsers(){try{const q=await db.collection("usuarios").get();U={};q.docs.forEach(d=>{U[d.id]=d.data()})}catch(e){U={}}}
async function enter(m){me=m;rol=m.rol;MODE=null;SEDE=m.sede==="Todas"?"Centro":m.sede;F=today();V="reg";SF="Todas";RNG={k:"7d",f:"",t:""};PD=[];leave();
 if(rol==="dueno")await loadUsers();await load();if(["socio","dueno"].includes(rol))setView("res")}
function loginUi(err){$("app").innerHTML=`<div class="card login"><h2>🍕 Cierre diario</h2><p class="sub" style="margin-bottom:12px">Inicie sesión con su usuario y contraseña.</p><label class="f"><small>Usuario</small><input id="lu" autocapitalize="none" autocomplete="username"></label><label class="f"><small>Contraseña</small><input id="lp" type="password" autocomplete="current-password"></label><p class="sub" style="color:var(--wr)">${esc(err||"")}</p><button data-a="login" style="width:100%">Entrar</button></div>`}
if(!CONFIGURADO)msg("Falta pegar la configuración de Firebase en este archivo (ver LEEME.md, paso 3).");
else onAuthStateChanged(auth,async u=>{if(!u){me=null;leave();return loginUi()}
 try{const s=await getDoc(doc(fdb,"usuarios/"+u.uid));if(!s.exists()){await signOut(auth);return loginUi("Este usuario no tiene perfil. Avise al dueño.")}await enter({...s.data(),uid:u.uid})}catch(e){loginUi("No se pudo iniciar sesión: "+(e?.code||e))}});

</script></body></html>
